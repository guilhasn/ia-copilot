<style>
@media print {
  .site-nav, .site-header, .site-footer, .search, .aux-nav { display: none !important; }
  .btn-print-page { display: none !important; }
  .main-content { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
}
.btn-print-page {
  float: right;
  padding: 0.5rem 1rem;
  background-color: #1F4E78;
  color: #fff !important;
  border-radius: 4px;
  text-decoration: none;
  font-size: 0.85rem;
  cursor: pointer;
  border: none;
  margin-bottom: 1rem;
}
.btn-print-page:hover { background-color: #163a5a; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var links = document.querySelectorAll("a[href^='http']");
  var host = window.location.hostname;
  for (var i = 0; i < links.length; i++) {
    if (links[i].hostname !== host) {
      links[i].setAttribute("target", "_blank");
      links[i].setAttribute("rel", "noopener noreferrer");
    }
  }
});
function printPage() {
  window.print();
}
</script>
