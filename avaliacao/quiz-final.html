<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grande Quiz Final — o curso inteiro | IA aplicada às IES</title>
<style>
  :root{
    --azul:#1F4E78; --azul2:#2E74B5; --claro:#DEEBF7; --ok:#2e7d32; --okbg:#e8f5e9;
    --erro:#c62828; --errobg:#fdecea; --cinza:#595959; --borda:#d9d9d9; --ouro:#b8860b;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:'Segoe UI',Calibri,system-ui,sans-serif; background:#f4f6f9; color:#222; line-height:1.55; padding:24px 12px}
  .wrap{max-width:760px; margin:0 auto}
  header{background:linear-gradient(135deg, var(--azul), #153A5B); color:#fff; border-radius:14px 14px 0 0; padding:26px 28px}
  header h1{font-size:1.35rem; font-weight:700}
  header p{opacity:.85; font-size:.95rem; margin-top:6px}
  .card{background:#fff; border:1px solid var(--borda); border-top:none; border-radius:0 0 14px 14px; padding:28px}
  .progress{height:8px; background:#e4e9f0; border-radius:99px; margin-bottom:22px; overflow:hidden}
  .progress > div{height:100%; background:var(--azul2); width:0; transition:width .3s}
  .qnum{font-size:.85rem; color:var(--cinza); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px}
  .qtext{font-size:1.12rem; font-weight:600; margin-bottom:18px}
  .opt{display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--borda); border-radius:10px;
       padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; transition:all .15s; font-family:inherit}
  .opt:hover:not(:disabled){border-color:var(--azul2); background:var(--claro)}
  .opt:disabled{cursor:default}
  .opt.correta{border-color:var(--ok); background:var(--okbg); font-weight:600}
  .opt.errada{border-color:var(--erro); background:var(--errobg)}
  .letra{display:inline-block; width:1.6em; font-weight:700; color:var(--azul2)}
  .feedback{border-radius:10px; padding:14px 16px; margin-top:14px; font-size:.97rem; display:none}
  .feedback.show{display:block}
  .feedback.ok{background:var(--okbg); border-left:5px solid var(--ok)}
  .feedback.ko{background:var(--errobg); border-left:5px solid var(--erro)}
  .feedback b{display:block; margin-bottom:4px}
  .nav{display:flex; justify-content:flex-end; margin-top:20px}
  button.next{background:var(--azul); color:#fff; border:none; border-radius:10px; padding:12px 26px; font-size:1rem;
       cursor:pointer; font-family:inherit; display:none}
  button.next.show{display:inline-block}
  button.next:hover{background:var(--azul2)}
  .resultado{text-align:center; display:none}
  .resultado.show{display:block}
  .score{font-size:3rem; font-weight:800; color:var(--azul); margin:14px 0 4px}
  .nivel{font-size:1.25rem; font-weight:700; margin-bottom:14px; color:var(--ouro)}
  .msg{color:var(--cinza); margin-bottom:22px}
  .rev{text-align:left; border-top:1px solid var(--borda); padding-top:18px; margin-top:8px}
  .rev h3{font-size:1rem; color:var(--azul); margin-bottom:10px}
  .rev-item{font-size:.92rem; margin-bottom:8px; padding-left:22px; position:relative}
  .rev-item::before{content:attr(data-i); position:absolute; left:0; font-weight:700; color:var(--azul2)}
  .rev-item.certa::after{content:" ✓"; color:var(--ok); font-weight:700}
  .rev-item.errada2::after{content:" ✗"; color:var(--erro); font-weight:700}
  button.retry{background:#fff; color:var(--azul); border:1.5px solid var(--azul); border-radius:10px;
       padding:12px 26px; font-size:1rem; cursor:pointer; font-family:inherit; margin-top:18px}
  button.retry:hover{background:var(--claro)}
  footer{text-align:center; color:var(--cinza); font-size:.82rem; margin-top:16px}
  footer a{color:var(--azul2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎓 Grande Quiz Final — o curso inteiro</h1>
    <p>Sessões 1 a 15: da Matriz Semáforo à proposta estratégica · 30 perguntas · anónimo, com feedback imediato</p>
  </header>
  <div class="card">
    <div class="progress"><div id="bar"></div></div>
    <div id="quiz"></div>
    <div class="nav"><button class="next" id="btnNext" onclick="proxima()">Próxima pergunta →</button></div>
    <div class="resultado" id="res">
      <div class="qnum">Resultado final</div>
      <div class="score" id="scoreTxt"></div>
      <div class="nivel" id="nivelTxt"></div>
      <div class="msg" id="msgTxt"></div>
      <div class="rev" id="revisao"></div>
      <button class="retry" onclick="reiniciar()">↻ Repetir o quiz</button>
    </div>
  </div>
  <footer>IA — Aplicações ao trabalho das IES · ANFUP · Formador: Nuno Salvador · <a href="index.html">voltar à Avaliação</a></footer>
</div>

<script>
const QUESTOES = [
 {
  "q": "Na Matriz Semáforo, o que torna um uso do Copilot VERDE?",
  "opts": [
   "Ser feito em horário de trabalho, com o computador e a conta de correio do serviço",
   "A natureza do conteúdo: fictício ou público, sem dados pessoais",
   "A autorização prévia e por escrito do superior hierárquico para a tarefa concreta",
   "A revisão do resultado por dois colegas antes de o enviar ou publicar"
  ],
  "c": 1,
  "exp": "S1: o critério é sempre o conteúdo, não a hora nem o equipamento. Verde é trabalhar com o que é fictício ou já público — o território recomendado para aprender e experimentar sem rede."
 },
 {
  "q": "Um colega quer resumir um documento interno na conta pessoal do ChatGPT «porque é só um minuto». A resposta do curso é:",
  "opts": [
   "Pode, desde que apague a conversa no fim e desative o histórico da conta",
   "Pode, porque resumir não é decidir e o uso é por isso sempre verde",
   "Nunca — a conta pessoal não tem a proteção de dados empresarial",
   "Pode, se o documento não citar nomes próprios nem valores orçamentais concretos"
  ],
  "c": 2,
  "exp": "S2: com sessão iniciada na conta institucional, os prompts não treinam modelos e ficam sob proteção de dados empresarial. Contas pessoais não dão essas garantias — documento interno em conta pessoal, nunca. Nem por um minuto."
 },
 {
  "q": "Qual é o VERMELHO transversal a todo o curso — do SIADAP aos júris, dos fluxos aos agentes?",
  "opts": [
   "Usar IA fora do horário de expediente sem conhecimento da chefia",
   "Submeter documentos com mais de cinquenta páginas numa única conversa",
   "Gerar conteúdo em línguas estrangeiras sem revisão de um falante nativo",
   "Decidir sobre pessoas: avaliar, pontuar, ordenar ou excluir"
  ],
  "c": 3,
  "exp": "O art. 22.º do RGPD limita decisões exclusivamente automatizadas com efeitos significativos, e o Anexo III do AI Act classifica emprego e avaliação de pessoas como alto risco. Apareceu na S1 e nunca mais saiu: a decisão sobre pessoas é humana."
 },
 {
  "q": "Os quatro componentes do framework GCSE de um bom prompt são:",
  "opts": [
   "Objetivo, Contexto, Fonte e Expectativas",
   "Gramática, Clareza, Síntese e Estrutura",
   "Goal, Copilot, Search e Edit",

  "c": 0,
  "exp": "S2: o que quero, para quê e para quem, a partir de quê, em que formato e tom. O esqueleto de todos os prompts do curso — do primeiro resumo em Word à especificação da investigação estratégica da S15."
 },
 {
  "q": "O mesmo prompt deu duas respostas diferentes em dois dias. Isto significa que…",
  "opts": [
   "…o serviço estava sobrecarregado num dos dias e conviria repetir fora das horas de ponta",
   "…é o comportamento normal de um modelo não-determinista",
   "…houve uma atualização silenciosa do modelo entre os dois dias",
   "…o prompt tem um erro de formulação que confunde o modelo"
  ],
  "c": 1,
  "exp": "S2: os modelos geram texto com aleatoriedade — não é avaria. A consequência atravessa o curso inteiro, do Word ao Designer do PowerPoint aos fluxos: o output é sempre rascunho a validar, nunca produto final."
 },
 {
  "q": "O que é uma alucinação de um modelo de linguagem — e porque é perigosa?",
  "opts": [
   "Uma resposta interrompida por limite de comprimento; perigosa porque perde conteúdo sem avisar",
   "Uma recusa em responder a temas sensíveis; perigosa porque atrasa o trabalho do serviço",
   "Conteúdo plausível mas falso; perigosa porque quanto mais plausível, menos se verifica",
   "Um erro de formatação; perigoso porque desalinha tabelas e listas numeradas"
  ],
  "c": 2,
  "exp": "S1: o modelo gera o texto mais provável, não o verdadeiro — e apresenta invenções com a mesma fluência das verdades. Por isso a validação com a fonte é hábito, não extra. Do resumo de e-mails ao artigo do CCP citado, a régua é a mesma."
 },
 {
  "q": "«Na segunda-feira a magia deixou de funcionar»: o colega colou a tarefa no Copilot Chat e saiu texto genérico. O que se esqueceu ele de fazer?",
  "opts": [
   "De colar primeiro o meta-prompt: cada conversa nova começa do zero",
   "De ativar o histórico de conversas nas definições da conta institucional",
   "De atualizar o navegador para a versão mais recente antes de iniciar sessão",

  "c": 0,
  "exp": "S3: cada conversa nova começa do zero — o Copilot Chat não memoriza instruções entre sessões. O meta-prompt é a entrada #0 da biblioteca: a primeira coisa a colar em cada conversa nova, antes de descrever a tarefa."
 },
 {
  "q": "Uma entrada bem-formada da biblioteca de prompts tem quatro campos:",
  "opts": [
   "Autor · data · versão · classificação",
   "Nome · quando usar · o prompt · como validar o resultado",
   "Aplicação · licença · custo · tempo poupado",
   "Título · palavras-chave · idioma · hiperligação"
  ],
  "c": 1,
  "exp": "S3: o campo que distingue a biblioteca do curso é a validação — o que verificar no resultado antes de o aproveitar. Um prompt guardado sem teste nem validação é uma promessa, não uma ferramenta."
 },
 {
  "q": "A regra-mãe da Sessão 5 (Outlook e Teams) é «o Copilot mapeia, a decisão é vossa». Mapear é:",
  "opts": [
   "Escolher que posição prevalece na thread e fixar o prazo de resposta",
   "Ordenar os intervenientes por relevância hierárquica",
   "Converter a caixa de correio numa base de dados",
   "Levantar posições, ações e tons — sem escolher nem fixar nada"
  ],
  "c": 3,
  "exp": "S5: o Copilot organiza o que foi dito; decidir que posição prevalece, que prazo é razoável, que prioridade dar — pertence a quem assina. E quem assina responde pelo ato."
 },
 {
  "q": "O recap de reunião atribui uma decisão a um colega. Validas como?",
  "opts": [
   "Confirmando o carimbo temporal indicado pelo Copilot, que é gerado pelo sistema",
   "Perguntando ao Copilot se tem a certeza, para forçar uma segunda verificação",
   "Confrontando a frase citada com a transcrição",
   "Verificando se a decisão aparece também no resumo automático do Teams"
  ],
  "c": 2,
  "exp": "S5: a régua é a frase, não o metadado — o timestamp é ele próprio um output. E pedir confirmação ao Copilot é pedir ao suspeito que confirme o álibi: máquina não valida máquina."
 },
 {
  "q": "«Máquina não valida máquina» — o que exige este princípio, na prática?",
  "opts": [
   "Validar contra a fonte: a folha, a transcrição, o diploma, o documento",
   "Usar dois modelos de IA diferentes e só aceitar o que ambos responderem de forma igual",
   "Repetir a mesma pergunta três vezes e ficar com a resposta maioritária das três",
   "Pedir ao Copilot que indique o grau de confiança de cada afirmação que produz"
  ],
  "c": 0,
  "exp": "Transversal a todo o curso: a validação faz-se contra a fonte — a folha de cálculo, a transcrição, o diploma, o documento de origem. Repetir perguntas ou cruzar modelos continua dentro da máquina; a fonte está fora."
 },
 {
  "q": "A regra de ouro da Sessão 6 (Excel):",
  "opts": [
   "Nunca mostrar mais de vinte linhas ao Copilot",
   "Antes de perguntar AOS dados, perguntar SOBRE os dados",
   "Pedir sempre os resultados em tabela dinâmica",
   "Converter a folha para valores antes de submeter"
  ],
  "c": 1,
  "exp": "S6: primeiro o diagnóstico estrutural — que colunas existem, que tipos têm, que problemas se veem (números em texto, células vazias). Sem isso, os defeitos da folha contaminam as respostas em silêncio."
 },
 {
  "q": "O Copilot diz «a taxa de resposta dentro do prazo é 78%». Antes de levar o número à Direção:",
  "opts": [
   "Nada — números resultam de cálculo, não de geração de texto",
   "Arredondar para 80%, que transmite mais confiança",
   "Pedir ao Copilot que confirme o valor",
   "Recalcular na folha ou conferir contra a fonte antes de o citar"
  ],
  "c": 3,
  "exp": "S6: números «por fora» validam-se com a fonte — uma fórmula simples chega. O hábito vale para todos os números do curso: percentagens do Excel, contagens de votos, valores citados em relatórios de investigação."
 },
 {
  "q": "Na Sessão 8 (PowerPoint), quais são os DOIS produtos que se confundem — e a diferença que importa?",
  "opts": [
   "Designer e SmartArt — o primeiro exige subscrição, o segundo vem incluído no Office",
   "PowerPoint Online e PowerPoint Desktop — só o segundo aceita comandos de IA",
   "Copilot no PowerPoint (com licença) e PowerPoint Agent (sem licença)",
   "Copilot Chat e ChatGPT — ambos geram diapositivos, mas só um é institucional"
  ],
  "c": 2,
  "exp": "S8: confundi-los é o erro que rebenta ao vivo. O Copilot dentro do PowerPoint exige licença (e o Designer para gerar de ficheiro); o PowerPoint Agent, no menu Agents do Chat, constrói o ficheiro a partir do documento anexado — sem licença."
 },
 {
  "q": "A técnica «Validação com a fonte» exige que cada afirmação num diapositivo (ou relatório)…",
  "opts": [
   "…seja aprovada pelo superior hierárquico antes da apresentação pública",
   "…possa apontar para uma frase do documento de origem",
   "…esteja formulada exatamente com as palavras do original, sem qualquer paráfrase",
   "…tenha menos de uma linha, para garantir a legibilidade em ecrã grande"
  ],
  "c": 1,
  "exp": "S8 — e depois S15, ao nível mais alto: afirmação a afirmação, procura-se a frase que a sustenta. Não precisa de ser literal; precisa de ter suporte. O que não tiver, sai ou volta à fonte."
 },
 {
  "q": "A «inversão» da Sessão 9 (SIADAP) manda:",
  "opts": [
   "Escrever primeiro os indicadores e as metas, e só depois o texto do objetivo",
   "Pedir dez objetivos ao Copilot, eliminar sete e afinar os três melhores",
   "Começar pelos objetivos da unidade orgânica e só depois descer aos individuais",
   "Não pedir objetivos ao Copilot — interrogar os que TU escreves"
  ],
  "c": 3,
  "exp": "S9: «cria-me 5 objetivos SMART» devolve texto plausível que serve qualquer serviço — e nenhum. Só tu conheces o serviço: escreves o objetivo e usas o Copilot como revisor adversarial, até o objetivo ficar defensável."
 },
 {
  "q": "A transcrição da reunião tem um [inaudível] num momento decisivo. O método da Sessão 10 manda:",
  "opts": [
   "Marcar [CONFIRMAR] e verificar com quem esteve na reunião",
   "Pedir ao Copilot que complete com a versão mais plausível, dado o contexto à volta",
   "Cortar o trecho da ata — o que não se ouviu não se registou",
   "Substituir pelo texto da convocatória, que descreve o ponto em discussão"
  ],
  "c": 0,
  "exp": "S10: um [inaudível] transformado em frase plausível é uma declaração que ninguém proferiu — numa ata que faz fé. Lacunas resolvem-se com humanos, não com probabilidade."
 },
 {
  "q": "O Copilot contou os votos da transcrição: «7 a favor, 2 contra». Antes de fixar a votação na ata:",
  "opts": [
   "Aceitar — contar é uma tarefa mecânica em que os modelos não falham",
   "Recontar por leitura humana da transcrição",
   "Confirmar com o Copilot, reformulando a pergunta de outra maneira para despistar o erro",
   "Usar o resultado previsto na convocatória, que antecipava a aprovação do ponto"
  ],
  "c": 1,
  "exp": "S10: a votação é o coração do ato formal — e os modelos erram contagens com toda a confiança. O número que faz fé conta-o o secretário."
 },
 {
  "q": "Porque é que a Sessão 11 (contratação pública) exige «os mesmos prompts para todas as propostas»?",

 {
  "q": "A resposta do Copilot cita um artigo do CCP para justificar uma exclusão. A doutrina do curso manda:",

 {

   "A escolha das ferramentas tecnológicas e o calendário de implementação",

  ],
  "c": 2,
  "exp": "S15: «internalizar o gabinete de estudos — não terceirizar o juízo». O que é realista nesta instituição, com este orçamento e esta cultura, decide-o o dirigente. E quem assina com trabalho sólido atrás ganha o que a consultora nunca daria: autoria."
 },
 {
  "q": "A auditoria a um relatório de investigação (S15) faz-se com uma pergunta fechada por afirmação:",
  "opts": [
   "«A fonte citada é de uma organização internacional prestigiada?»",
   "«O relatório está bem organizado por temas e com secções claras?»",
   "«O Copilot indicou um nível de confiança elevado nesta afirmação?»",
   "«Esta afirmação está mesmo na fonte citada — sim ou não?»"
  ],
  "c": 3,
  "exp": "S15: um relatório estratégico só vale o que as suas citações aguentarem. Abrem-se as fontes e verifica-se — e se está, a fonte diz aquilo ou diz menos? Só o que sobreviver entra na proposta ao Reitor."
 },
 {
  "q": "O prompt mestre do consultor da S15 não foi escrito à mão. Como nasceu?",
  "opts": [
   "Por meta-prompting: o Arquiteto entrevistou o formador e desenhou-o",
   "Foi adaptado de um modelo público da Prompt Gallery da Microsoft",
   "Foi gerado pelo Researcher a partir de relatórios públicos de consultoras internacionais",
   "Foi escrito de raiz pela equipa pedagógica da ANFUP para este curso"
  ],
  "c": 0,
  "exp": "S15: quatro respostas ao Arquiteto — problema, utilizadores, produto final, ferramenta — seguidas de entrevista, e o meta-prompt produziu o prompt mestre. Dois prompts, dois papéis: um desenha, o outro executa. Mudando as quatro respostas, crias o próximo consultor."
 },
 {
  "q": "Qual destas frases resume o arco das quinze sessões — da régua de semáforo à política de IA da instituição?",
  "opts": [
   "«Com a licença certa, a IA faz o trabalho todo»",
   "«A IA prepara, a pessoa decide — de cada e-mail à estratégia da instituição»",
   "«A validação humana deixa de ser precisa quando os agentes amadurecerem»",
   "«O importante é usar IA em tudo, depressa, antes que os outros usem»"
  ],
  "c": 1,
  "exp": "É a doutrina de todo o curso, da S1 à S15: a IA mapeia, resume, propõe, investiga e monta — e em cada degrau a decisão, a assinatura e a responsabilidade ficam humanas. Neste curso a IA não substituiu ninguém: promoveu-te — de quem executa processos para quem os desenha e governa."
 }
];

let i = 0, certas = 0, respostas = [];
const $ = id => document.getElementById(id);

function render(){
  $('bar').style.width = (i / QUESTOES.length * 100) + '%';
  const Q = QUESTOES[i];
  let h = `<div class="qnum">Pergunta ${i+1} de ${QUESTOES.length}</div>`;
  h += `<div class="qtext">${Q.q}</div>`;
  Q.opts.forEach((o, k) => {
    h += `<button class="opt" onclick="responder(${k})"><span class="letra">${'abcd'[k]})</span>${o}</button>`;
  });
  h += `<div class="feedback" id="fb"></div>`;
  $('quiz').innerHTML = h;
  $('btnNext').classList.remove('show');
  $('btnNext').textContent = (i === QUESTOES.length - 1) ? 'Ver resultado →' : 'Próxima pergunta →';
}

function responder(k){
  const Q = QUESTOES[i];
  const botoes = document.querySelectorAll('.opt');
  botoes.forEach(b => b.disabled = true);
  botoes[Q.c].classList.add('correta');
  const ok = (k === Q.c);
  if(ok){ certas++; } else { botoes[k].classList.add('errada'); }
  respostas.push(ok);
  const fb = $('fb');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'ko');
  fb.innerHTML = `<b>${ok ? '✓ Correto!' : '✗ Não é essa.'}</b>${Q.exp}`;
  $('btnNext').classList.add('show');
}

function proxima(){
  i++;
  if(i < QUESTOES.length){ render(); }
  else { resultado(); }
}

function resultado(){
  $('bar').style.width = '100%';
  $('quiz').innerHTML = '';
  $('btnNext').classList.remove('show');
  const pct = Math.round(certas / QUESTOES.length * 100);
  $('scoreTxt').textContent = `${certas}/${QUESTOES.length}`;
  let nivel, msg;
  if(pct >= 90){ nivel = '🎓 Embaixador de IA da tua instituição'; msg = 'Notável. Quinze sessões, cinco blocos, uma doutrina — e dominas o conjunto. Agora falta o gesto final: entregar a proposta. Obrigado por teres feito este percurso.'; }
  else if(pct >= 70){ nivel = '🏆 Sólido de uma ponta à outra'; msg = 'Muito bom — tens o essencial do curso contigo. Revê as explicações das perguntas falhadas: cada uma aponta a sessão onde a doutrina vive.'; }
  else if(pct >= 50){ nivel = '📈 Boa base — falta consolidar'; msg = 'Metade do caminho feito. Os quizzes por bloco são o melhor treino: faz os dos blocos onde falhaste mais e volta cá.'; }
  else { nivel = '🌱 O curso continua contigo'; msg = 'Sem stress — o hub fica online: revisita as sessões, refaz os quizzes por bloco, e este resultado sobe. É para isso que o material cá fica.'; }
  $('nivelTxt').textContent = nivel;
  $('msgTxt').textContent = msg;
  let rev = '<h3>Revisão rápida</h3>';
  QUESTOES.forEach((Q, k) => {
    rev += `<div class="rev-item ${respostas[k] ? 'certa' : 'errada2'}" data-i="${k+1}.">${Q.q.substring(0, 90)}${Q.q.length > 90 ? '…' : ''}</div>`;
  });
  $('revisao').innerHTML = rev;
  $('res').classList.add('show');
}

function reiniciar(){
  i = 0; certas = 0; respostas = [];
  $('res').classList.remove('show');
  render();
}

render();
</script>
</body>
</html>
